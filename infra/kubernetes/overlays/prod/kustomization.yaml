apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: marscast-prod

resources:
  - namespace.yaml
  - ../../base

images:
  - name: marscast
    newName: registry.cars-operator-system.svc.cluster.local:5000/p2ppsr/marscast
    newTag: local

patches:
  - target:
      kind: Certificate
      name: marscast-tls
    patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - marscast-backend.babbage.systems
